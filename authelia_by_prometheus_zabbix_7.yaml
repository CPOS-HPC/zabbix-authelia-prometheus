      tags:
      - tag: component
        value: authentication
      value_type: FLOAT
      units: s
    - uuid: c91df5f5a7344021945c5b0b519942d3
      name: 'Authelia: AuthZ HTTP 200 (total)'
      type: DEPENDENT
