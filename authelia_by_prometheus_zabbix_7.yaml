    - uuid: 810a8103a99641d5ba205283985bf9b5
      name: 'Authelia: Authentication attempts per minute'
      type: CALCULATED
      key: authelia.authn.total.per_min
      delay: 1m
      history: 30d
      value_type: FLOAT
      units: attempts/min
      params: last(//authelia.authn.success.per_min)+last(//authelia.authn.failure.per_min)
      description: Successful plus failed authentication attempts per minute.
      tags:
      - tag: component
        value: authentication
    - uuid: 21948ad8636242218774a73b40865390
      name: 'Authelia: Authentication success rate'
      type: CALCULATED
      key: authelia.authn.success.pct
      delay: 1m
      history: 30d
      value_type: FLOAT
      units: '%'
      params: 100*last(//authelia.authn.success.per_min)/(last(//authelia.authn.success.per_min)+last(//authelia.authn.failure.per_min)+0.000001)
      description: Authentication success percentage for the latest interval. A value near 0 during periods with no authentication traffic should
        be interpreted as no activity.
      tags:
      - tag: component
        value: authentication
    - uuid: e9a26073781f44dcaf0de4b49ac1b457
      name: 'Authelia: Average authentication latency'
      type: CALCULATED
      key: authelia.authn.latency.avg
      delay: 1m
      history: 30d
      value_type: FLOAT
      units: s
      params: (last(//authelia.authn.success.duration.per_min)+last(//authelia.authn.failure.duration.per_min))/(last(//authelia.authn.success.per_min)+last(//authelia.authn.failure.per_min)+0.000001)
      description: Average end-to-end authentication attempt duration during the latest interval.
      tags:
      - tag: component
        value: authentication
      triggers:
      - uuid: 4b1deee999544f36a43a85fab4da5343
        expression: avg(/Authelia by Prometheus/authelia.authn.latency.avg,5m)>{$AUTHELIA.AUTH.LATENCY.WARN} and avg(/Authelia by Prometheus/authelia.authn.total.per_min,5m)>0
        name: 'Authelia: Authentication latency is high'
        priority: WARNING
        description: The 5-minute average authentication latency exceeded {$AUTHELIA.AUTH.LATENCY.WARN} seconds while authentication traffic was
          present.
