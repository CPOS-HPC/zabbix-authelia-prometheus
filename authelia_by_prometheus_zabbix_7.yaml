    - uuid: e151776dcb4d489b881872a5dcfae95f
      name: 'Authelia: Successful authentications per minute'
      type: DEPENDENT
      key: authelia.authn.success.per_min
      history: 30d
      value_type: FLOAT
      units: attempts/min
      description: Successful authentication attempts per minute.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - authelia_authn_duration_count{success="true"}
        - value
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: CHANGE_PER_SECOND
        parameters:
        - ''
      - type: MULTIPLIER
        parameters:
        - '60'
      master_item:
        key: web.page.get["{$AUTHELIA.METRICS.HOST}","{$AUTHELIA.METRICS.PATH}","{$AUTHELIA.METRICS.PORT}"]
      tags:
      - tag: component
        value: authentication
    - uuid: d1d7f2f90f1f407393454b8c8d195be9
      name: 'Authelia: Failed authentications per minute'
      type: DEPENDENT
      key: authelia.authn.failure.per_min
      history: 30d
      value_type: FLOAT
      units: attempts/min
      description: Failed authentication attempts per minute.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - authelia_authn_duration_count{success="false"}
        - value
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: CHANGE_PER_SECOND
        parameters:
        - ''
      - type: MULTIPLIER
        parameters:
        - '60'
      master_item:
        key: web.page.get["{$AUTHELIA.METRICS.HOST}","{$AUTHELIA.METRICS.PATH}","{$AUTHELIA.METRICS.PORT}"]
      tags:
      - tag: component
        value: authentication
      triggers:
      - uuid: e9202e88bb054e07a5fcab1b0976ec96
        expression: avg(/Authelia by Prometheus/authelia.authn.failure.per_min,5m)>{$AUTHELIA.AUTH.FAIL.RATE.WARN}
        name: 'Authelia: Authentication failure rate is high'
        priority: WARNING
        description: The 5-minute average failed-authentication rate exceeded {$AUTHELIA.AUTH.FAIL.RATE.WARN} attempts/min.
    - uuid: aa9ed31e33e6400bbe0f537fc626155b
      name: 'Authelia: Successful authentication duration per minute'
      type: DEPENDENT
      key: authelia.authn.success.duration.per_min
      history: 30d
      value_type: FLOAT
      units: s/min
      description: Change in cumulative successful authentication duration, normalized per minute.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - authelia_authn_duration_sum{success="true"}
        - value
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: CHANGE_PER_SECOND
