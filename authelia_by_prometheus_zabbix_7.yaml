zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: b941f67e82a54ce886e14db998f20b2b
    name: Templates/Applications
  templates:
  - uuid: fa3e7a37734b4990bd5c4f80027d4bb3
    template: Authelia by Prometheus
    name: Authelia by Prometheus
    description: Monitors Authelia through its Prometheus /metrics endpoint using a local Zabbix agent. The agent fetches localhost metrics with
      web.page.get, so the metrics port does not need to be exposed to the Zabbix server/proxy. Includes authentication/authorization counters
      and rates, HTTP and OIDC activity, request latency, Prometheus scrape health, Go runtime metrics, process metrics, graphs, dashboards, and
      alerting.
    groups:
    - name: Templates/Applications
    items:
    - uuid: 22267bdae9484b7e8fead03ca5253ed9
      name: 'Authelia: Get Prometheus metrics'
      key: web.page.get["{$AUTHELIA.METRICS.HOST}","{$AUTHELIA.METRICS.PATH}","{$AUTHELIA.METRICS.PORT}"]
      delay: 1m
      history: 1h
      trends: '0'
      value_type: TEXT
      description: Fetches the Authelia Prometheus /metrics endpoint locally through the Zabbix agent using web.page.get. The HTTP response headers
        are stripped before dependent Prometheus preprocessing is applied.
      tags:
      - tag: component
        value: raw
      triggers:
      - uuid: 59175c77dae246a8be683ae17a6793a8
        expression: nodata(/Authelia by Prometheus/web.page.get["{$AUTHELIA.METRICS.HOST}","{$AUTHELIA.METRICS.PATH}","{$AUTHELIA.METRICS.PORT}"],5m)=1
        name: 'Authelia: Metrics endpoint unavailable'
        priority: AVERAGE
        description: No Prometheus metrics have been received from Authelia for 5 minutes.
      preprocessing:
      - type: REGEX
        parameters:
        - (?s)^.*?\r?\n\r?\n(.*)$
        - \1
        error_handler: DISCARD_VALUE
    - uuid: 2138d89802d04cfe81902f2d93035aab
      name: 'Authelia: Successful authentication attempts (total)'
      type: DEPENDENT
      key: authelia.authn.success.total
      history: 30d
      description: Cumulative successful authentication attempts since the Authelia process started.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - authelia_authn_duration_count{success="true"}
        - value
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: web.page.get["{$AUTHELIA.METRICS.HOST}","{$AUTHELIA.METRICS.PATH}","{$AUTHELIA.METRICS.PORT}"]
      tags:
      - tag: component
        value: authentication
    - uuid: fa0dd49c32c9426d9dda9300c2014794
      name: 'Authelia: Failed authentication attempts (total)'
      type: DEPENDENT
      key: authelia.authn.failure.total
      history: 30d
      description: Cumulative failed authentication attempts since the Authelia process started.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - authelia_authn_duration_count{success="false"}
        - value
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: web.page.get["{$AUTHELIA.METRICS.HOST}","{$AUTHELIA.METRICS.PATH}","{$AUTHELIA.METRICS.PORT}"]
      tags:
      - tag: component
        value: authentication
    - uuid: 07c46265e705452797a1f30f75b7035b
      name: 'Authelia: Successful authentication duration sum'
      type: DEPENDENT
      key: authelia.authn.success.duration.sum
      history: 30d
      description: Cumulative duration of successful authentication attempts.
      preprocessing:
      - type: PROMETHEUS_PATTERN
        parameters:
        - authelia_authn_duration_sum{success="true"}
        - value
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      master_item:
        key: web.page.get["{$AUTHELIA.METRICS.HOST}","{$AUTHELIA.METRICS.PATH}","{$AUTHELIA.METRICS.PORT}"]
      tags:
      - tag: component
        value: authentication
      value_type: FLOAT
      units: s
    - uuid: f835ec4d54d74bdd9cd4824a6b68caab
